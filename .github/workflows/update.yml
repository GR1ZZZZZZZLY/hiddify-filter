name: Update filtered HAPP subscriptions

on:
  schedule:
    # GitHub cron uses UTC. Offset minutes avoid the busiest quarter-hour marks.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Send a Telegram test notification after a successful build
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: update-filtered-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Capture previous bot status
        shell: bash
        run: |
          previous="$RUNNER_TEMP/previous_bot_status.json"
          if git cat-file -e HEAD:bot_status.json 2>/dev/null; then
            git show HEAD:bot_status.json > "$previous"
          else
            printf '{}\n' > "$previous"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run offline safety tests
        run: >-
          python -m unittest -v
          test_filter_subscription.py
          test_telegram_notify.py

      - name: Build safer subscriptions without RU nodes
        env:
          SOURCE_URL: https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/verified/configs.txt
          V2GO_SOURCE_URL: https://raw.githubusercontent.com/Danialsamadi/v2go/main/AllConfigsSub.txt
          FAST_SOURCE_URL: https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/fast/configs.txt
          SECURE_SOURCE_URL: https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/secure/configs.txt
          TOP_SOURCE_URL: https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/top100.txt
          OUTPUT_FILE: subscription.txt
          REALITY_OUTPUT_FILE: reality_tcp.txt
          REALITY_ALL_OUTPUT_FILE: reality_all.txt
          BEST_OUTPUT_FILE: reality_best.txt
          STABLE_OUTPUT_FILE: reality_stable.txt
          DURABLE_OUTPUT_FILE: reality_durable.txt
          LOCAL_OUTPUT_FILE: reality_local.txt
          LOCAL_RESULTS_FILE: local_results.json
          LOCAL_TEST_HMAC_KEY: ${{ secrets.LOCAL_TEST_HMAC_KEY }}
          REPORT_FILE: security_report.json
          BOT_STATUS_FILE: bot_status.json
          HISTORY_FILE: node_history.json
          CHECKSUMS_FILE: checksums.sha256
          MIN_CONFIGS: "5"
          MIN_REALITY_CONFIGS: "1"
          MIN_REALITY_ALL_CONFIGS: "1"
          MIN_BEST_CONFIGS: "1"
          MIN_STABLE_CONFIGS: "1"
          MIN_DURABLE_CONFIGS: "0"
          MIN_LOCAL_CONFIGS: "0"
          BEST_LIMIT: "50"
          STABLE_LIMIT: "100"
          DURABLE_LIMIT: "50"
          LOCAL_LIMIT: "50"
          LOCAL_RESULTS_MAX_AGE_SECONDS: "10800"
          LOCAL_REQUIRED_SUCCESSES: "2"
          LOCAL_REQUIRED_ATTEMPTS: "3"
          BOT_WARN_STRICT_CONFIGS: "20"
          BOT_WARN_BEST_CONFIGS: "10"
          BOT_WARN_STABLE_CONFIGS: "10"
          BOT_WARN_LOCAL_CONFIGS: "3"
        run: python filter_subscription.py

      - name: Commit changed subscription
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            subscription.txt \
            reality_tcp.txt \
            reality_all.txt \
            reality_best.txt \
            reality_stable.txt \
            reality_durable.txt \
            reality_local.txt \
            security_report.json \
            bot_status.json \
            node_history.json \
            checksums.sha256

          if git diff --cached --quiet; then
            echo "Subscription has not changed"
            exit 0
          fi

          git commit -m "chore: update filtered subscription"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Notify Telegram about state changes
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          arguments=(
            --mode success
            --status bot_status.json
            --previous "$RUNNER_TEMP/previous_bot_status.json"
            --run-url "$RUN_URL"
          )
          if [[ "$TELEGRAM_TEST" == "true" ]]; then
            arguments+=(--force)
          fi
          python telegram_notify.py "${arguments[@]}"

      - name: Notify Telegram about workflow failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW_FILE: update.yml
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python telegram_notify.py
          --mode failure
          --run-url "$RUN_URL"
